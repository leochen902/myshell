# Shell
set -g default-shell /opt/homebrew/bin/bash
set -g default-command /opt/homebrew/bin/bash

# Terminal / colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -as terminal-features ",*:RGB"
set -g allow-passthrough on

# Prefix: Ctrl-a (Ctrl-a Ctrl-a sends Ctrl-a to the shell)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Quality of life
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-clipboard on
set -sg escape-time 10
set -g focus-events on
set -g status-interval 2
set -g aggressive-resize on
setw -g mode-keys vi
setw -g automatic-rename on

# Reload
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# Splits and windows stay in the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

# Windows
bind -r n next-window
bind -r p previous-window

# Copy mode (vi) -> macOS clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# Catppuccin Mocha
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
setw -g clock-mode-colour "#89b4fa"

set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#1e1e2e]"
set -g status-right "#[fg=#1e1e2e,bg=#a6e3a1] %Y-%m-%d #[fg=#1e1e2e,bg=#89dceb] %H:%M "
setw -g window-status-format "#[fg=#6c7086,bg=#1e1e2e] #I #W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I #W "
setw -g window-status-separator ""
